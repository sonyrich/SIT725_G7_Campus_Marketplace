<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Campus Marketplace</title>

    <link rel="stylesheet" href="css/style.css">
  <script src="js/nav.js"></script>
</head>

<body>

    <a class="skip-link" href="#main">Skip to content</a>

  <header class="masthead">
    <div class="wrap masthead-inner">
      <a href="index.html" class="brand">Campus <span>Marketplace</span></a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open menu">
        <span class="nav-toggle-bar"></span>
      </button>

      <nav class="primary-nav" id="primary-nav" aria-label="Main">
        <a href="index.html">Browse</a>
        <a href="create-listing.html">Sell an item</a>
        <a href="#" data-auth="in">My listings</a>
        <a href="login.html" data-auth="out">Log in</a>
        <!-- FR-03 Logout Functionality (handled by js/nav.js + js/logout.js) -->
        <a href="#" data-auth="in" data-action="logout">Log out</a>
        <span class="nav-user" data-auth="in" data-user-name></span>
        <a href="register.html" class="btn btn-primary btn-sm" data-auth="out">Sign up</a>
      </nav>
    </div>
  </header>

    <main id="main" class="auth-container">

        <div class="auth-card">

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to your Campus Marketplace account.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="loginEmail">Student Email</label>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="Enter your student email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="btn-primary">
                    Login
                </button>

                <p id="loginMessage" class="message"></p>

            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

        </div>

    </main>

    <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>Campus Marketplace — built by students, for students.</span>
      <span class="footer-links">
        <a href="#">About</a>
        <a href="#">Safety tips</a>
        <a href="#">Contact</a>
      </span>
    </div>
  </footer>

    <script src="js/auth.js"></script>

  <script src="js/logout.js"></script>
</body>
</html>
