<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Report listing — Campus Marketplace
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  />
</head>


<body>

  <header class="masthead">

    <div class="wrap masthead-inner">

      <a
        href="index.html"
        class="brand"
      >
        Campus <span>Marketplace</span>
      </a>


      <nav class="primary-nav">

        <a href="index.html">
          Browse
        </a>

        <a href="create-listing.html">
          Sell an item
        </a>

        <a href="#">
          My listings
        </a>

        <a href="login.html">
          Log in
        </a>

        <a
          href="register.html"
          class="cta"
        >
          Sign up
        </a>

      </nav>

    </div>

  </header>


  <section class="form-page">

    <div class="wrap">

      <h1>
        Report listing
      </h1>

      <p class="sub">
        Report an inappropriate, suspicious or potentially unsafe marketplace listing.
      </p>


      <form
        class="card-form"
        id="report-listing-form"
      >

        <div class="field">

          <label>
            Listing
          </label>

          <p
            id="listing-name"
            style="
              margin: 0;
              padding: 10px 12px;
              background: #fff;
              border: 1px solid var(--line);
              border-radius: 3px;
            "
          >
            Loading listing...
          </p>

        </div>


        <div class="field">

          <label for="reason">
            Reason for report
          </label>

          <select
            id="reason"
            name="reason"
            required
          >

            <option
              value=""
              disabled
              selected
            >
              Select a reason
            </option>

            <option value="inappropriate">
              Inappropriate content
            </option>

            <option value="suspicious">
              Suspicious listing
            </option>

            <option value="scam">
              Possible scam
            </option>

            <option value="other">
              Other
            </option>

          </select>

        </div>


        <div class="field">

          <label for="details">
            Additional details
            <span class="hint">
              Optional — maximum 500 characters
            </span>
          </label>

          <textarea
            id="details"
            name="details"
            maxlength="500"
            placeholder="Explain why you are reporting this listing..."
          ></textarea>

        </div>


        <div class="form-actions">

          <button
            type="submit"
            class="btn-primary"
          >
            Submit report
          </button>

          <a
            href="index.html"
            class="btn-text"
          >
            Cancel
          </a>

        </div>

      </form>

    </div>

  </section>


  <footer>

    <div
      class="wrap"
      style="
        display:flex;
        justify-content:space-between;
        width:100%;
        flex-wrap:wrap;
        gap:10px;
      "
    >

      <span>
        Campus Marketplace — built by students, for students.
      </span>

      <span>
        <a href="#">About</a> ·
        <a href="#">Safety tips</a> ·
        <a href="#">Contact</a>
      </span>

    </div>

  </footer>


  <script src="js/reportListing.js"></script>

</body>

</html>
