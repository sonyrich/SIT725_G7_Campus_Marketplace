<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sell an item — Campus Marketplace</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="masthead">
    <div class="wrap masthead-inner">
      <a href="index.html" class="brand">Campus <span>Marketplace</span></a>
      <nav class="primary-nav">
        <a href="index.html">Browse</a>
        <a href="create-listing.html">Sell an item</a>
        <a href="#">My listings</a>
        <a href="login.html">Log in</a>
        <a href="register.html" class="cta">Sign up</a>
      </nav>
    </div>
  </header>

  <section class="form-page">
    <div class="wrap">
      <h1>List an item for sale</h1>
      <p class="sub">Give buyers the details they need to trust the listing at a glance.</p>

      <!--
        Jayadhwaj: this posts to POST /api/listings once the Create Listing
        API is ready. Auth header + multipart handling goes in
        js/createListing.js — form stays plain HTML/CSS until then.
      -->
      <form class="card-form" id="create-listing-form">

        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" placeholder="e.g. Intro to Algorithms (4th ed.)" required />
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" name="description" placeholder="Condition details, why you're selling, any marks or wear..." required></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="price">Price <span class="hint">AUD</span></label>
            <input type="number" id="price" name="price" min="0" step="0.01" placeholder="0.00" required />
          </div>

          <div class="field">
            <label for="condition">Condition</label>
            <select id="condition" name="condition" required>
              <option value="" disabled selected>Select condition</option>
              <option value="New">New</option>
              <option value="Like New">Like New</option>
              <option value="Good">Good</option>
              <option value="Fair">Fair</option>
              <option value="Poor">Poor</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="" disabled selected>Select category</option>
            <option value="textbooks">Textbooks</option>
            <option value="electronics">Electronics</option>
            <option value="furniture">Furniture</option>
            <option value="bikes">Bikes</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="image">Photo</label>
          <div class="file-drop">
            <input type="file" id="image" name="image" accept="image/*" />
            <p style="margin: 8px 0 0;">A clear photo helps your item sell faster.</p>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary">Publish listing</button>
          <a href="index.html" class="btn-text">Cancel</a>
        </div>

      </form>
    </div>
  </section>

  <footer>
    <div class="wrap" style="display:flex; justify-content:space-between; width:100%; flex-wrap:wrap; gap:10px;">
      <span>Campus Marketplace — built by students, for students.</span>
      <span>
        <a href="#">About</a> ·
        <a href="#">Safety tips</a> ·
        <a href="#">Contact</a>
      </span>
    </div>
  </footer>

  <script src="js/createListing.js"></script>
</body>
</html>
